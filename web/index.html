<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browser-native CHIRP — kurulumsuz radyo programlama. Pyodide + WebSerial." />
    <title>CHIRP-Web</title>
    <link rel="preload" as="fetch" href="chirp-bundle/chirp_pkg.tar" crossorigin="anonymous" />
    <!--
      COI bootstrap — when the page isn't already cross-origin isolated
      (i.e. GitHub Pages, where we can't set headers server-side), the
      service worker injects COOP/COEP into all responses. Worker
      registration must happen as early as possible so the first reload
      sees the headers; we do it from the inline script below.
    -->
    <script>
      // COI bootstrap. The host might not send COOP/COEP headers
      // (GitHub Pages doesn't); we install a service worker that
      // rewrites response headers and reload once so the new headers
      // take effect.
      (function () {
        if (!("serviceWorker" in navigator)) return;
        if (!window.isSecureContext) return; // HTTPS required for SAB
        if (window.crossOriginIsolated) return; // already good

        // Guard against a reload loop: if we just bounced and the page
        // is *still* not isolated, give up gracefully. The app will
        // show a clear error when SAB is needed.
        var loopKey = "chirp.coiReloadAttempted";
        if (window.sessionStorage.getItem(loopKey) === "1") {
          // Clear so a fresh future visit can try again.
          window.sessionStorage.removeItem(loopKey);
          console.warn("COI reload attempt didn't isolate the page");
          return;
        }

        navigator.serviceWorker.register("sw.js", { scope: "./" }).then(
          function (reg) {
            // Wait for the SW to become active, then reload if it's
            // not yet controlling this page.
            function maybeReload() {
              if (
                navigator.serviceWorker.controller ||
                !reg.active
              ) {
                if (reg.active && !window.crossOriginIsolated) {
                  // Active but page isn't isolated → reload.
                  window.sessionStorage.setItem(loopKey, "1");
                  window.location.reload();
                }
                return;
              }
              // No controller yet — trigger reload to acquire one.
              window.sessionStorage.setItem(loopKey, "1");
              window.location.reload();
            }
            if (reg.installing) {
              reg.installing.addEventListener("statechange", maybeReload);
            } else {
              maybeReload();
            }
          },
          function (err) {
            console.warn("coi sw register failed:", err);
          },
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
